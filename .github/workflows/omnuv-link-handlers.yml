---
# The omnuv:// handlers, run as a browser runs them, with stubbed programs.
# A link is input from any web page; these check what reaches a program.
name: Link handlers
permissions:
  contents: read

on:
  push:
    paths:
      - packaging/connect/**
      - tests/connect/**
      - .github/workflows/omnuv-link-handlers.yml
  pull_request:
    branches:
      - master

jobs:
  handlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell handler (Linux and macOS)
        run: sh tests/connect/handle_test.sh
      - name: Shell sign-in against a stand-in Core
        run: sh tests/connect/signin_test.sh
      - name: Shell enrol names where a key leads before spending it
        run: sh tests/connect/enrol_test.sh
      - name: The .deb refuses in words where netbird already holds the network
        run: sh packaging/connect/linux/preinst_test.sh
      - name: The .deb records whoever installed it as the tunnel's owner
        run: sh packaging/connect/linux/postinst_test.sh
      - name: The macOS package records whoever installed it as the tunnel's owner
        run: sh packaging/connect/macos/postinstall_test.sh
      - name: The Windows installers record the person at the desk as the tunnel's owner
        shell: pwsh
        run: pwsh -NoProfile -File packaging/connect/nsis/record-owner_test.ps1
      - name: PowerShell handler (Windows)
        shell: pwsh
        run: pwsh -NoProfile -File tests/connect/handle_test.ps1
      - name: PowerShell enrol names where a key leads before spending it
        shell: pwsh
        run: pwsh -NoProfile -File tests/connect/enrol_test.ps1
