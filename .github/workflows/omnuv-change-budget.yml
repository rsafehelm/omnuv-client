# The rule that keeps this fork alive, checked rather than remembered.
#
# A fork that edits a hundred upstream files cannot follow upstream, and a fork
# that cannot follow upstream dies. So our changes go in new files, and only a
# short list of upstream files may be touched at all. This fails the build when
# anything else differs, which is the point: the person who breaks the rule in a
# year will not be the person who wrote it.
#
# Raising the budget is allowed. Doing it silently is not: the list lives here,
# in a diff someone reviews.
name: change budget

on:
  push:
  pull_request:

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # moonlight-common-c is where the connection stages are defined, and
          # the last step below reads them. Three small submodules; the one
          # that matters is 1.7 MB.
          submodules: recursive

      - name: Compare against the upstream base
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/moonlight-stream/moonlight-qt
          git fetch -q --no-tags upstream master

          # Everything we add lives under these paths.
          #
          # terminal/ arrived on 21 September 2026: the marketplace CLI, moved
          # out of the private repository because a buyer has to be able to get
          # it. It is a separate Rust binary that links nothing here and is not
          # built by qmake -- the same shape as tunnel/, at the root for the
          # same reason -- so it adds nothing to the upstream diff a rebase has
          # to carry.
          # Widened on 23 September 2026, when this step had been failing at
          # HEAD with 29 files outside the lists. Each is ours and new:
          #   tunnel/          the Go daemon that holds the private network,
          #                    a separate binary at the root, like terminal/
          #   tests/connect/   the tests of packaging/connect's link handlers
          #   wix/Omnuv*       the installer, replacing upstream's wix/Moonlight*
          #   app/omnuv.ico, app/omnuv.icns   the product's own icons
          #   scripts/fetch-vcredist           fetches the MSVC runtime the
          #                    installer bundles, against a published digest
          #   scripts/fetch-wintun             fetches Wintun the same way (24 Sep)
          ADDED='^(app/omnuv/|app/gui/OmnuvView.qml|CHANGES.omnuv.md|README.omnuv.md|.github/workflows/omnuv-|terminal/|packaging/|tunnel/|tests/connect/|wix/Omnuv|app/omnuv\.(ico|icns)$|scripts/fetch-(vcredist|wintun)$)'
          # And these upstream files, and only these, may be edited.
          #
          # .github/dependabot.yml is the first entry added after the fork, and
          # the reason is worth keeping: it is upstream's, it updates submodules
          # daily, and this fork pins its submodules to the upstream commit it
          # is based on. Left alone it opens a pull request every day proposing
          # to break that pin. Removed here rather than fought.
          # app/main.cpp is the second entry, added for residency. It bought
          # two lines then: QSystemTrayIcon needs a QApplication rather than
          # the QGuiApplication upstream constructs, and a program that
          # survives its window being closed needs
          # setQuitOnLastWindowClosed(false). Both are single lines next to
          # each other; neither has an equivalent that could live in a new
          # file, because the application object is constructed here.
          # It bought two more on 15 Sep for the `signin` action — an include
          # and one arm of the switch that already dispatches every other
          # action — for the same reason: that switch is here, and everything
          # the arm calls is in app/omnuv/signin.cpp.
          # It bought three more on 15 Sep for the `stream` verb: one changed
          # string literal and two context properties, in the arm that already
          # constructs that action's launcher. The rig measured what
          # `OmnuvClient.exe stream <host> "<app>"` actually drew and answered
          # `SEGUE=absent` — upstream's Material ErrorMessageDialog, upstream's
          # words — and that command is what `omnuv-connect --stream` and every
          # `omnuv://stream` link run, so it was the buyer-facing surface for
          # everyone outside the widget. It could not live in a new file: the
          # switch that chooses an initial view is here, and so is the parse
          # that produces the two positional arguments the view needs. The view
          # itself is app/omnuv/OmnuvCliSegue.qml.
          # And three more on 15 Sep for the style: an include, and
          # QQuickStyle::setStyle("Material") replaced by a call into
          # app/omnuv/appearance.cpp that picks FluentWinUI3 on Windows and
          # Material everywhere else. The same reason again, and this time it
          # is Qt's rule rather than ours: setStyle() refuses once QtQuick
          # .Controls has been registered, so it has to run before the engine
          # loads any QML, and nothing of ours runs earlier than this function.
          # .github/workflows/build.yml, build-appimage.yml and
          # build-steamlink.yml are removed (the operator's decision of 25
          # September 2026): Build existed only to run the AppImage and Steam
          # Link jobs, both failed on every run since at least 17 September,
          # and neither is an Omnuv target: Linux ships as the .deb, and
          # Windows and macOS are built on the lab rigs. build-win-mac.yml is
          # kept, unchanged and uncalled: to build there again, call it from a
          # workflow of our own (`uses: ./.github/workflows/build-win-mac.yml`
          # with a `ci_version`), which is an added file, not an upstream edit.
          # (What follows is build.yml's earlier entry, kept for its history.)
          # .github/workflows/build.yml is the third entry. It buys the
          # Windows/macOS job commented out, 22+/5- against upstream (measured
          # 24 September 2026), all but the five commented lines being the
          # comment that says why. Those platforms are
          # built on the lab rigs now, which have the same pinned toolchains
          # and can additionally *run* the result — CI only ever proved the
          # thing compiled, and the bug that made every Windows build exit at
          # startup was invisible to it.
          # app/cli/commandlineparser.(cpp|h) is the fourth entry, and it buys
          # four lines: one enum value, one arm in the action loop, and one line
          # of help text, for the `signin` action. It could not live in a new
          # file. Upstream's parser terminates the process on any option it does
          # not recognise, so a global `--print-code` flag of ours is a usage
          # error before our own code runs; only a positional action is
          # tolerated, and the loop that recognises those is in this file.
          # Everything the action then does is in app/omnuv/signin.cpp, which is
          # why this is four lines and not a sub-parser.
          # scripts/build-arch.bat is the fifth entry: 48+/15- against upstream
          # (measured 24 September 2026), in three parts. The styles: upstream
          # ships Material, so it excludes every other style from windeployqt
          # *and* deletes their QML modules afterwards -- two separate places,
          # both of which had to stop naming FluentWinUI3 and Fusion. The
          # tunnel: onvtunneld.exe, wintun.dll and its licence are copied into
          # the portable package, per architecture. And the product's names in
          # place of Moonlight's. None could live in a new file: this is the
          # only invocation of windeployqt and the only place the portable
          # package is assembled.
          # app/streaming/session.cpp, app/streaming/video/ffmpeg.cpp and
          # app/streaming/video/overlaymanager.(cpp|h) are the sixth entry, and
          # they buy the in-stream half of the product: the quality mark, the
          # stats panel, the "no picture" state, and the one line a second the
          # end-to-end harness reads. Everything they decide is in
          # app/omnuv/streamquality.cpp; what is here is five call sites and one
          # setter, and none of them could live in a new file.
          #
          # Qt is suspended for the whole of a stream -- session.cpp:1963 says
          # so in as many words, and StreamSegue.qml runs gc() before starting
          # for the same reason -- so `windows_impl.md` I4's "small QML overlay"
          # and "raises a QML state" are not buildable as written. What draws
          # over a stream is Overlay::OverlayManager, a string rasterised into
          # an SDL_Surface that each renderer composites, and these are the only
          # places its two slots are fed:
          #
          #   ffmpeg.cpp        the once-a-second statistics window. The numbers
          #                     exist nowhere else and are private to
          #                     FFmpegVideoDecoder; an accessor on IVideoDecoder
          #                     would have cost decoder.h plus every decoder.
          #                     One call, in the branch that already ran, plus
          #                     lifting the two-window sum out of a guard on a
          #                     hotkey -- because the harness has to be able to
          #                     read the numbers when nobody pressed it.
          #   session.cpp       clConnectionStatusUpdate wrote this overlay
          #                     itself and now hands its verdict over instead,
          #                     because two writers of one surface overwrite
          #                     each other; the SDL event loop is the only tick
          #                     that still runs when frames have stopped, which
          #                     is exactly the state I4 asks to be drawn; and
          #                     clConnectionTerminated is the line that turns a
          #                     dropped stream into "Error code: -1".
          #   overlaymanager    one setter, beside the getter that was already
          #                     there. The colour was fixed at construction, and
          #                     D3 asks for amber *and* red. The alternative was
          #                     a third OverlayType, which is a position case in
          #                     all six renderers (d3d11va, sdlvid, plvk, eglvid,
          #                     drm, slvid) rather than six lines in one file.
          #
          # What was *not* bought, and the shape of I4 reflects it: no renderer
          # was touched, so the mark is in the slot that already exists at the
          # bottom-left rather than the top-right D3 draws it in, and no key
          # binding was added, so "Stop" is the quit combination upstream
          # already has rather than a button there is no cursor to click.
          #
          # Fusion is kept as well as Fluent, and that is not scope creep:
          # FluentWinUI3 implements a subset of Qt Quick Controls, and the
          # unsupported ones fall back to Fusion -- StackView among them, which
          # main.qml is built on.
          # Pairing owns a bounded certificate wait and an explicit cancellation
          # token. These four backend files bridge the upstream worker to the
          # Omnuv network wrapper; the generic HTTP backend remains unchanged.
          # Added on 23 September 2026, each already committed with its reason:
          #   app/gui/NavigableToolButton.qml  00be62f0: the icon sized itself
          #       from its own button under FluentWinUI3, a loop that pegged the
          #       UI thread; the fix has to sit where the binding is
          #   app/OmnuvClient.exe.manifest     upstream's Moonlight.exe.manifest,
          #       renamed with the executable (the branding rule)
          #   scripts/build-appimage.sh, build-steamlink-app.sh,
          #   generate-bundle.bat, generate-dmg.sh, generate-ico.sh
          #       the artefact names and icons they produce are Omnuv's
          #   wix/Moonlight/, wix/MoonlightSetup/   removed, replaced by wix/Omnuv*
          EDITED='^(app/backend/(nvpairingmanager|computermanager).(cpp|h)|app/gui/main.qml|app/main.cpp|app/app.pro|app/cli/commandlineparser.(cpp|h)|app/streaming/session.cpp|app/streaming/video/ffmpeg.cpp|app/streaming/video/overlaymanager.(cpp|h)|app/Info.plist|app/version.txt|app/deploy/.*|app/res/.*|scripts/build-arch.bat|.github/workflows/build(-appimage|-steamlink)?.yml|.github/dependabot.yml|app/gui/NavigableToolButton.qml|app/OmnuvClient.exe.manifest|scripts/(build-appimage.sh|build-steamlink-app.sh|generate-bundle.bat|generate-dmg.sh|generate-ico.sh)|wix/Moonlight/.*|wix/MoonlightSetup/.*)$'

          base=$(git merge-base HEAD upstream/master)
          echo "base: $base"
          over=$(git diff --name-only "$base"..HEAD | grep -vE "$ADDED" | grep -vE "$EDITED" || true)

          if [ -n "$over" ]; then
            echo
            echo "These upstream files were changed, and are not in the budget:"
            echo "$over" | sed 's/^/  /'
            echo
            echo "Either put the change in a new file under app/omnuv/, or send it"
            echo "upstream, or widen the list in this workflow with a reason."
            exit 1
          fi
          echo "within budget: $(git diff --name-only "$base"..HEAD | wc -l) file(s) changed"

      # stdout is a machine-readable channel, and a channel with two writers is
      # not one. `signin` writes key=value lines that a harness parses; every
      # other line this application produces — logs, progress, complaints — goes
      # to the log file or to stderr. That holds today by construction, and this
      # is what keeps it holding after somebody adds a print to debug something.
      #
      # Scoped to our own directory: upstream's cli/ prints to stdout
      # legitimately (`list` is a report), and the point here is only that
      # Omnuv's code has exactly one place that does.
      - name: Only the command-line actions write to stdout
        run: |
          set -euo pipefail
          other=$(grep -rlE '\b(fprintf|fputs|fwrite)[[:space:]]*\([^;]*stdout|\bstd::cout\b|\bputs[[:space:]]*\(' \
                    app/omnuv --include='*.cpp' --include='*.h' \
                  | grep -vE '^app/omnuv/(signin|enrolcli|paircli)\.cpp$' || true)

          if [ -n "$other" ]; then
            echo "These files in app/omnuv/ write to stdout, which belongs to signin, enrol and pair:"
            echo "$other" | sed 's/^/  /'
            exit 1
          fi

          # And prove the check can still see. A grep whose pattern has rotted
          # returns nothing, and nothing is exactly what a clean tree returns —
          # so it has to find the one writer that is supposed to be there.
          grep -qE '\bfprintf\(stdout' app/omnuv/signin.cpp
          grep -qE '\bfputs\([^;]*stdout' app/omnuv/enrolcli.cpp
          grep -qE '\bfputs\([^;]*stdout' app/omnuv/paircli.cpp
          echo "stdout has three writers, each a command-line action with a stdout contract: signin, enrol, pair"

      # Two rules `app/omnuv/Theme.qml` exists to hold, checked rather than
      # remembered, because both fail silently.
      #
      # An icon is named or it is not reviewable. A Segoe Fluent Icons glyph is
      # a private-use character: pasted into a view it is invisible in a diff,
      # it is not greppable, and one is indistinguishable from the next — so
      # `Theme.icon.refresh` is not a convenience, it is the only form of it a
      # person can check. Theme itself writes them as `\uE72C`-style escapes for the
      # same reason: the escape is text somebody can search for and look up.
      #
      # And a duration that forgot to collapse takes an accessibility setting
      # away from the person who set it. Microsoft's own description of reduced
      # motion says moving content "can cause seizures in users with
      # photo-sensitive epilepsy", so a number here that is not gated on
      # `motion` is a defect rather than a polish item.
      - name: Icons are named, and durations collapse
        run: |
          set -euo pipefail

          # Literal private-use characters, anywhere in our code but Theme.qml —
          # which has none either, and is excluded only so this stays true if
          # one is ever deliberately added there.
          glyphs=$(grep -rlP '[\x{E000}-\x{F8FF}]' app/omnuv \
                     --include='*.qml' --include='*.cpp' --include='*.h' \
                   | grep -v '^app/omnuv/Theme\.qml$' || true)
          # And the escaped form, which is just as unreadable in a view.
          glyphs="$glyphs$(grep -rlE '\\u[eE][0-9a-fA-F]{3}' app/omnuv \
                             --include='*.qml' --include='*.cpp' --include='*.h' \
                           | grep -v '^app/omnuv/Theme\.qml$' || true)"

          if [ -n "${glyphs//[[:space:]]/}" ]; then
            echo "These files carry an icon code point instead of a Theme.icon name:"
            echo "$glyphs" | sed 's/^/  /'
            exit 1
          fi

          # Prove the check can still see. A pattern that has rotted finds
          # nothing, and nothing is what a clean tree looks like — so it has to
          # find the one file that is supposed to have them.
          test "$(grep -cE '\\u[eE][0-9a-fA-F]{3}' app/omnuv/Theme.qml)" -ge 13

          # Every duration Theme exposes is gated on the reduced-motion setting.
          ungated=$(grep -nE 'property int duration' app/omnuv/Theme.qml \
                    | grep -v 'motion ?' || true)
          if [ -n "$ungated" ]; then
            echo "These durations do not collapse under reduced motion:"
            echo "$ungated" | sed 's/^/  /'
            exit 1
          fi
          test "$(grep -cE 'property int duration' app/omnuv/Theme.qml)" -ge 4

          echo "icons are named; $(grep -cE 'property int duration' app/omnuv/Theme.qml) durations collapse"

      # **Every connection stage has a sentence a buyer can read, and the list
      # comes from upstream rather than from this file.**
      #
      # `app/omnuv/OmnuvSegue.qml` switches on moonlight-common-c's stage names
      # to decide what a person is told while a stream starts and what they are
      # told when it does not. Those names are `stageNames[]` in
      # `moonlight-common-c/src/Connection.c`; `Limelight.h` calls them stable,
      # which is what makes switching on them legitimate, and stable is not the
      # same as closed. A release that adds a thirteenth would fall through to a
      # sentence naming no cause — correct, and worse than the one somebody
      # would have written had they known.
      #
      # So the check is against upstream's own array, in the submodule, and it
      # fails on the commit that bumps it rather than on the first failure a
      # buyer sees.
      - name: Every connection stage has a sentence
        run: |
          set -euo pipefail
          src=moonlight-common-c/moonlight-common-c/src/Connection.c
          names=$(sed -n '/^static const char\* stageNames\[/,/^};/p' "$src" \
                  | grep -oE '"[^"]+"' | tr -d '"')

          # Prove the extraction can still see. A `sed` range that has rotted
          # returns nothing, and nothing is exactly what "no stage is missing"
          # looks like — the calm an empty answer produces. There are twelve
          # today and `STAGE_MAX` is 12; fewer than ten means the pattern broke,
          # not that upstream deleted the stream.
          test "$(echo "$names" | wc -l)" -ge 10

          missing=""
          while IFS= read -r n; do
            grep -qF "case \"$n\":" app/omnuv/OmnuvSegue.qml || missing="$missing  $n"$'\n'
          done <<< "$names"

          if [ -n "${missing//[[:space:]]/}" ]; then
            echo "These connection stages have no sentence in app/omnuv/OmnuvSegue.qml:"
            printf '%s' "$missing"
            echo
            echo "Read what the stage actually does in Connection.c and write a sentence"
            echo "for it. A plain one is fine; an invented cause is not."
            exit 1
          fi
          echo "all $(echo "$names" | wc -l) connection stages have a sentence"

      # And the numbers stay folded away. Upstream reports a failed stage as
      # `Starting %1 failed: Error %2` in a `main.qml` dialog whose id is
      # `streamSegueErrorDialog`; our segue never opens it, which is the whole
      # reason our segue exists. A reference to it from our code would put the
      # code back in front of a buyer without changing a line that looks like
      # it does.
      - name: A buyer is never shown an error code
        run: |
          set -euo pipefail
          # A *use* — the name followed by a property access or an assignment —
          # and not on a comment line. Both filters are needed and the first
          # run of this check proved it: the segue explains in its own comment
          # why it never opens that dialog, and a bare grep matched the
          # explanation and failed against code that was correct. A check whose
          # first finding is its own prose is the one shape CLAUDE.md names for
          # source-level checks, and it is not a reason to reword the comment.
          if grep -rnE 'streamSegueErrorDialog[[:space:]]*[.=]' app/omnuv \
             | grep -vE ':[[:space:]]*(//|\*)'; then
            echo
            echo "app/omnuv/ opens upstream's stream error dialog, which prints a numeric"
            echo "code. Put the failure in OmnuvSegue's panel instead: a sentence, the"
            echo "actions that apply, and the code under Details."
            exit 1
          fi
          # Prove the check can still see, both halves of it: the dialog it is
          # looking for exists, and the pattern still matches a real use of it
          # where one is supposed to be.
          grep -q 'id: streamSegueErrorDialog' app/gui/main.qml
          grep -qE 'streamSegueErrorDialog[[:space:]]*[.=]' app/gui/StreamSegue.qml
          echo "no path from app/omnuv/ to upstream's error dialog"

      # **And the command line reaches the segue a buyer sees.**
      #
      # The step above proves our code never opens upstream's numeric-code
      # dialog. It says nothing about whether our code is *reached*, and on
      # 15 Sep 2026 the Windows rig measured that it was not: `OmnuvClient.exe
      # stream <host> "<app>"` went to upstream's `CliStartStreamSegue` and its
      # Material `ErrorMessageDialog`, and the rig reported `SEGUE=absent`.
      #
      # That is the command `omnuv-connect --stream` runs, the command every
      # `omnuv://stream` link from the console runs, and the command the
      # gaming-rig end-to-end streams with — so the one automated proof of the
      # streaming experience was exercising upstream's surface, and a parity
      # matrix fed by it would have read *same* on a row where the two paths
      # genuinely differed. A check that only forbids is half a check; this is
      # the half that requires.
      - name: The command line opens our segue
        run: |
          set -euo pipefail
          if grep -q 'initialView = "qrc:/gui/CliStartStreamSegue.qml"' app/main.cpp; then
            echo "The stream action opens upstream's segue, which answers a failure with a"
            echo "Material dialog and a numeric code. Point it at qrc:/omnuv/OmnuvCliSegue.qml."
            exit 1
          fi
          grep -q 'initialView = "qrc:/omnuv/OmnuvCliSegue.qml"' app/main.cpp
          # Prove the check can still see: the view it names exists, is shipped
          # in our own resource file, and is the segue rather than a second one.
          test -f app/omnuv/OmnuvCliSegue.qml
          grep -q '<file>OmnuvCliSegue.qml</file>' app/omnuv/omnuv.qrc
          grep -qE '^OmnuvSegue \{' app/omnuv/OmnuvCliSegue.qml
          echo "the stream action opens app/omnuv/OmnuvCliSegue.qml"

      # **The segue says what it drew, because nothing else can look at it.**
      #
      # `deployment/ansible/files/omnuv-run.ps1` in the platform repository
      # drives a stream against a name under `.invalid` and reads the sentence
      # out of the client's log, anchored on `Qt Info: Omnuv segue: failed
      # headline=`. That contract was written down there on the client's behalf
      # and the client never held up its end: until 15 Sep 2026 the string had
      # never appeared in this repository, so the rig would have answered
      # `SEGUE=absent` even after the routing above was fixed.
      #
      # `console.info`, not `console.error`: Qt's `writeToConsole` maps `Info`
      # to `logger.info()` and `Error` to `logger.critical()`
      # (qtdeclarative/src/qml/qml/qqmlbuiltinfunctions.cpp), and Moonlight's
      # handler renders those as `Qt Info:` and `Qt Critical:`
      # (app/main.cpp:216-220). The wrong one is a line the harness cannot see.
      #
      # Anchored at the start of the line so this cannot match the segue's own
      # comment explaining the contract — a source check that finds its own
      # prose is the one shape CLAUDE.md names, and this file has met it once
      # already, three steps up.
      - name: The segue reports the sentence it rendered
        run: |
          set -euo pipefail
          HEAD='^[[:space:]]*console\.info\("Omnuv segue: failed headline='
          BODY='^[[:space:]]*console\.info\("Omnuv segue: details='
          for pat in "$HEAD" "$BODY"; do
            if ! grep -qE "$pat" app/omnuv/OmnuvSegue.qml; then
              echo "app/omnuv/OmnuvSegue.qml does not report what it drew:"
              echo "  $pat"
              echo
              echo "deployment/ansible/files/omnuv-run.ps1 reads these two lines and has no"
              echo "other way to know whether the failure panel rendered a sentence, an"
              echo "error code, or nothing at all."
              exit 1
            fi
          done
          # Prove both patterns can still see, against a line written here
          # rather than one in the tree: a rotted pattern and a missing call
          # return the same nothing.
          probe=$(mktemp --suffix=.qml)
          printf '    console.info("Omnuv segue: failed headline=" + oneLine(t))\n' > "$probe"
          printf '    console.info("Omnuv segue: details=" + oneLine(t))\n' >> "$probe"
          grep -qE "$HEAD" "$probe"
          grep -qE "$BODY" "$probe"
          rm -f "$probe"
          echo "the segue reports its headline and its details at Info level"

      # **The streaming login never reaches a log, and never reaches a disk.**
      #
      # A machine mints that login once and Core hands it over once — the
      # password is cleared in the same statement that returns it — so there is
      # no second copy to compare against and no way to notice a leak after the
      # fact. It exists for the few hundred milliseconds between one Core reply
      # and one request to the machine, and the only places it could escape are
      # a log line and a settings write. Both are one keystroke away from a
      # developer debugging something at two in the morning, which is what this
      # step is for.
      #
      # The log file is the reason it matters more here than for the sign-in
      # token: `app/main.cpp` installs a message handler that writes every
      # qDebug/qInfo/qWarning to a file people paste into support threads.
      - name: The stream credential never reaches a log or a setting
        run: |
          set -euo pipefail

          # A logging call, or a persistence call, on the same line as the
          # words this credential travels under.
          LEAK='(qDebug|qInfo|qWarning|qCritical|qFatal|setValue|OmnuvCredentials::store)[^;]*(password|stream-credentials|Basic )'

          if grep -rnE "$LEAK" app/omnuv --include='*.cpp' --include='*.h'; then
            echo
            echo "A streaming login can reach a log file or a setting from here. It is"
            echo "issued once and cannot be reissued, so a copy of it outlives the thing"
            echo "it was for. Keep it in the call that spends it."
            exit 1
          fi

          # Prove the check can still see. A clean tree and a rotted pattern
          # return the same nothing, so the pattern has to be shown matching
          # the thing it is for — against a line written here rather than one
          # in the tree, because the tree is supposed never to contain one.
          probe=$(mktemp --suffix=.cpp)
          printf 'qInfo() << "login" << password;\n' > "$probe"
          grep -qE "$LEAK" "$probe"
          rm -f "$probe"
          echo "no path from a stream credential to a log or a setting"

      # **The launch ladder says the same four things the web console says, in
      # the same words, from the same fields.**
      #
      # A buyer watching a machine start sees it in two places: the browser and
      # this application. Two vocabularies for one launch is the thing v0.2
      # refuses outright — "Private network · not observed" has to mean exactly
      # one thing, and a person who learns it in one place has to have learned
      # it in the other.
      #
      # The console lives in a private repository this workflow cannot reach, so
      # this cannot be a comparison; it is a pin. The four steps, the fields
      # each one is drawn from, and the state each combination produces are
      # written out below exactly as `console-buyer`'s `ladder()` has them, and
      # a change to any of them fails here. That is the point: the next person
      # to alter this ladder has to alter this list in the same diff, where a
      # reviewer can see that the console moved too.
      #
      # Whitespace is squeezed before comparing, so reformatting is free and
      # only the vocabulary is pinned.
      - name: The launch ladder matches the console's
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib

          src = pathlib.Path("app/omnuv/MachineCard.qml").read_text()
          body = re.search(r"function ladder\(\) \{(.*?)\n    \}", src, re.S)
          if not body:
              sys.exit("could not find ladder() in app/omnuv/MachineCard.qml")

          def squeeze(text):
              return re.sub(r"\s+", " ", text).strip()

          # The evidence, and then the four steps. Left column is where it is
          # written; right column is what console-buyer/.../instances says.
          pinned = [
              # what confirms a step, never a constant
              'readonly property bool running: model.status === "Running"',
              'readonly property bool booted: running || model.status === "Starting"',
              'readonly property bool addressed: model.privateIp !== ""',
              'readonly property bool failed: model.status === "Needs attention"',
              # the four steps, in order, with their states
              '{ label: qsTr("Requested and placed"), state: "done", note: "" },',
              'label: qsTr("Booting"),',
              'state: failed ? "failed" : running ? "done" : booted ? "active" : "unknown",',
              'note: (!running && booted) ? model.waitingOn : ""',
              'label: qsTr("Private network"),',
              'state: addressed ? "done" : running ? "unknown" : "pending",',
              'label: qsTr("Running"),',
              'state: running ? "done" : failed ? "failed" : "pending",',
          ]

          flat = squeeze(src)
          missing = [p for p in pinned if squeeze(p) not in flat]
          if missing:
              print("The launch ladder no longer matches the console's:")
              for m in missing:
                  print("  " + m)
              print()
              print("If this was deliberate, change console-buyer's ladder() in the same")
              print("change and update the list in this workflow. If it was not, a buyer")
              print("is about to be told two different things about one machine.")
              sys.exit(1)

          # Prove the check can still see. A pattern that has rotted matches
          # nothing, and nothing is exactly what a clean tree looks like.
          for word in ("done", "active", "pending", "unknown", "failed"):
              if '"%s"' % word not in body.group(1):
                  sys.exit("ladder() never produces the state %r; the check is reading the wrong thing" % word)

          print("the ladder pins %d expressions and produces all five states" % len(pinned))
          PY

      # **The two colours the in-stream mark draws in are Theme's, and a copy
      # of a value is a value that drifts.**
      #
      # `app/omnuv/Theme.qml` is a QML singleton and QML does not run during a
      # stream, so `app/omnuv/streamquality.cpp` cannot read it: it holds a
      # copy, as an SDL_Color. That copy is only safe while something compares
      # it, which is this. The dark-theme variant of each on purpose — the
      # overlay sits on video over a black outline, not on a themed surface.
      - name: The stream mark's colours match Theme's
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib

          theme = pathlib.Path("app/omnuv/Theme.qml").read_text()
          impl = pathlib.Path("app/omnuv/streamquality.cpp").read_text()

          def theme_dark(name):
              # readonly property color fillCaution: ... ? "#FCE100" : "#9D5D00"
              # Across lines, and no further than this property: 5c35c95e split each
              # definition over two, and this read only the first.
              m = re.search(r'property color %s:(?:(?!\n\s*readonly property)[\s\S])*?"#([0-9A-Fa-f]{6})"' % name, theme)
              if not m:
                  sys.exit("Theme.qml no longer defines %s as a dark/light pair" % name)
              return m.group(1).upper()

          def impl_colour(name):
              # const SDL_Color kCaution = {0xFC, 0xE1, 0x00, 0xFF};
              m = re.search(r'const SDL_Color %s\s*=\s*\{([^}]*)\}' % name, impl)
              if not m:
                  sys.exit("streamquality.cpp no longer defines %s" % name)
              parts = [p.strip() for p in m.group(1).split(",")]
              if len(parts) != 4:
                  sys.exit("%s is not an RGBA quad" % name)
              return "".join("%02X" % int(p, 16) for p in parts[:3])

          for qml, cpp in (("fillCaution", "kCaution"), ("fillCritical", "kCritical")):
              want, got = theme_dark(qml), impl_colour(cpp)
              if want != got:
                  sys.exit("Theme.%s is #%s and streamquality.cpp's %s is #%s.\n"
                           "The overlay cannot read Theme at run time, so the copy has to be\n"
                           "changed in the same diff. Take the dark-theme value: the mark sits\n"
                           "on video over a black outline, not on a themed surface." % (qml, want, cpp, got))
              print("%-14s #%s" % (qml, want))

          # Prove the check can still see. A regex that has rotted finds nothing,
          # and nothing is exactly what two agreeing values look like.
          if theme_dark("fillCaution") == theme_dark("fillCritical"):
              sys.exit("the two Theme colours read the same; the extraction is reading the wrong thing")
          PY

      # **"I could not tell" never renders as a zero.**
      #
      # Two of the five readings are genuinely unknowable and both are unknown
      # on real hosts: host processing latency is documented as zero when the
      # host does not send it (Limelight.h:150-155), and LiGetEstimatedRttInfo()
      # fails on an old or departed peer — upstream prints the literal "N/A"
      # for the second. `docs/client-widget.md` and omnuv_protocol::CheckResult
      # both say the same thing about that state: never a pass, never a failure.
      #
      # A zero in either place is a pass, and it is a pass the end-to-end
      # harness would read as a perfect score. This is the one defect in this
      # file that is invisible in every screenshot.
      - name: An unknown reading is never a zero
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib

          src = pathlib.Path("app/omnuv/streamquality.cpp").read_text()

          def body(fn):
              m = re.search(r"\nvoid %s\([^)]*\)\n\{(.*?)\n\}\n" % fn, src, re.S)
              if not m:
                  sys.exit("could not find %s() in streamquality.cpp" % fn)
              return m.group(1)

          # The log line is the harness's channel: both unknowables say `na`.
          log = body("writeLogLine")
          for want in ('"na"',):
              if log.count(want) < 2:
                  sys.exit('writeLogLine() emits %s fewer than twice. Host latency and round\n'
                           'trip are both unknowable and both must say so rather than print 0,\n'
                           'which gaming-rig-e2e would read as a perfect score.' % want)

          # The panel is the person's: both say the word.
          panel = body("writePanel")
          if panel.count('"unknown') < 2:
              sys.exit('writePanel() writes "unknown" fewer than twice. See above; a person\n'
                       'reading 0.0 ms of host latency concludes the host is instant.')

          # And the verdict abstains rather than passing when nothing could be
          # graded — the rule that makes the two above meaningful.
          if "if (!out.anyKnown)" not in src or "out.verdict = VerdictUnknown;" not in src:
              sys.exit("evaluate() no longer collapses to VerdictUnknown when nothing could be\n"
                       "graded. An ungradeable stream would report as good.")

          print("unknown stays unknown in the log line, the panel and the verdict")
          PY

      # **The thresholds still derive the numbers the lab was going to assert.**
      #
      # `windows_impl.md`'s end-to-end bar is >= 55 of 60 frames and under 12 ms
      # of host processing latency. `app/omnuv/streamquality.h` does not hold
      # either number: it holds a ratio of the negotiated frame rate and a
      # fraction of one frame interval, because an absolute 55 is unreachable
      # at 30 fps and met while half the frames are missing at 120.
      #
      # The claim that those two forms agree at 60 Hz is arithmetic, and this
      # is the arithmetic. It fails on the commit that changes a constant
      # without revisiting the story told beside it.
      - name: The stream thresholds still derive the lab's numbers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib

          src = pathlib.Path("app/omnuv/streamquality.h").read_text()

          def value(name):
              m = re.search(r"double %s\s*=\s*([0-9.]+)\s*;" % name, src)
              if not m:
                  sys.exit("streamquality.h no longer defines %s" % name)
              return float(m.group(1))

          fps_caution = value("fpsCaution")
          host_caution = value("hostCaution")

          # At 60 Hz, which is what the lab runs.
          frames = fps_caution * 60
          host_ms = host_caution * (1000.0 / 60.0)

          if not (54.0 <= frames <= 56.0):
              sys.exit("fpsCaution x 60 is %.1f frames; the lab bar it is derived from is 55.\n"
                       "Either the ratio moved or the story in the header is now wrong." % frames)
          if not (11.0 <= host_ms <= 13.0):
              sys.exit("hostCaution x one 60 Hz frame is %.1f ms; the lab bar it is derived\n"
                       "from is 12. Either the fraction moved or the story is now wrong." % host_ms)

          # Every threshold carries the reason it is that number, and the
          # calibration knob still names them all. A threshold that lost its
          # knob cannot be tuned on the rig, which is what D3 asks for.
          names = re.findall(r"double (\w+)\s*=\s*[0-9.]+\s*;", src)
          if len(names) < 11:
              sys.exit("only %d thresholds found; the extraction is reading the wrong thing" % len(names))

          impl = pathlib.Path("app/omnuv/streamquality.cpp").read_text()
          knob = re.search(r"struct \{ const char\* name; double\* slot; \} table\[\] = \{(.*?)\};", impl, re.S)
          if not knob:
              sys.exit("could not find the OMNUV_STREAM_QUALITY table in streamquality.cpp")
          tunable = set(re.findall(r"&th\.(\w+)", knob.group(1)))
          missing = [n for n in names if n not in tunable]
          if missing:
              sys.exit("these thresholds cannot be tuned on the rig: %s\n"
                       "windows_v2.md D3: the thresholds are 'tuned on hardware, because every\n"
                       "network reads differently and the calibration knob has to exist'."
                       % ", ".join(missing))

          print("%d thresholds, all tunable; 60 Hz gives %.1f frames and %.1f ms"
                % (len(names), frames, host_ms))
          PY

      # **Nothing drawn over a stream may use a character the overlay font
      # does not have.**
      #
      # `Overlay::OverlayManager` renders with app/ModeSeven.ttf, a teletext
      # face. Measured with fontTools against the file in this repository: 101
      # glyphs — every printable ASCII character except `~`, plus U+00A3,
      # U+00BC-BE, U+00F7 and U+2010. No block-drawing characters, no bullet,
      # no middle dot. `TTF_RenderUTF8_Blended_Wrapped` does not complain about
      # a glyph it cannot find, so a mark drawn in U+2588 is a mark nobody
      # sees and nothing fails.
      #
      # Hence the four bars are `[||||]` and not `[▇▇▇▇]`. This is the check
      # that keeps somebody from improving them.
      - name: The in-stream text stays inside the overlay font
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib

          src = pathlib.Path("app/omnuv/streamquality.cpp").read_text()
          bad = []
          for m in re.finditer(r'"((?:[^"\\]|\\.)*)"', src):
              for ch in m.group(1):
                  if ord(ch) > 0x7F or ch == "~":
                      bad.append((ch, m.group(1)[:60]))

          if bad:
              print("These string literals use characters app/ModeSeven.ttf does not have:")
              for ch, where in bad:
                  print("  U+%04X in %r" % (ord(ch), where))
              print()
              print("The overlay font is ASCII less `~`. A missing glyph renders as nothing")
              print("and nothing reports it, so the mark simply stops being there.")
              sys.exit(1)

          # Prove the check can still see: it has to reject a character that is
          # genuinely outside the font, written here rather than found in the
          # tree, because the tree is supposed never to contain one.
          probe = 'const char* bars = "[██]";'
          if not [c for c in re.search(r'"((?:[^"\\]|\\.)*)"', probe).group(1) if ord(c) > 0x7F]:
              sys.exit("the scan no longer finds a non-ASCII glyph in a literal; it is reading the wrong thing")

          print("every in-stream literal is inside the overlay font")
          PY

      # **D1's exit evidence, run rather than promised.**
      #
      # "Feed every local probe a failure and assert that no row is green" is
      # the one check `docs/client-widget.md` leaves behind, and it is the
      # cheapest possible guard against the failure mode that has already cost
      # this project a day: a watcher that cannot see reports the same calm a
      # healthy system does.
      #
      # `app/omnuv/traystate.h` has no Qt in it for exactly this reason, so the
      # check needs no Qt, no window, no notification area and no rig — a bare
      # compiler and a second. What it asserts, and what it deliberately also
      # asserts, is in the file: that the one arrangement which *is* green
      # still comes back green, because every assertion about "never Connected"
      # would pass against a function that always returned Idle.
      - name: The tray icon never claims health it was not given
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -Iapp/omnuv \
              app/omnuv/traystate_check.cpp -o /tmp/traystate_check
          /tmp/traystate_check

      # **One grouping of Core's status words, and the build fails when a
      # second appears.**
      #
      # The tray menu shows a machine by name with a dot and a word, which is
      # the thing `tray.h` refused to do until I3 — and the reason it gave was
      # right and still is: a second place where the machine list is
      # *interpreted* is a second vocabulary, and then one machine wears two
      # different dots in two of our own surfaces and nothing can say which is
      # wrong.
      #
      # So the grouping lives in `machinemodel.cpp` once, the card switches on
      # the same words in `MachineCard.qml`, and this reads both and compares
      # them — a comparison rather than a text pin, because the two are written
      # in different languages and neither can call the other. The four colours
      # are pinned too: `tray.cpp` is C++ and cannot reach a QML singleton, so
      # it carries Microsoft's own values a second time and this is what keeps
      # the copies honest.
      - name: The tray, the card and Theme group Core's words the same way
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib

          card  = pathlib.Path("app/omnuv/MachineCard.qml").read_text()
          model = pathlib.Path("app/omnuv/machinemodel.cpp").read_text()
          tray  = pathlib.Path("app/omnuv/tray.cpp").read_text()
          theme = pathlib.Path("app/omnuv/Theme.qml").read_text()

          # --- the card's grouping, read out of its own switch -----------------------
          body = re.search(r"function statusColour\(status\) \{(.*?)\n    \}", card, re.S)
          if not body:
              sys.exit("could not find statusColour() in app/omnuv/MachineCard.qml")

          card_group, pending = {}, []
          for line in body.group(1).splitlines():
              line = line.strip()
              m = re.match(r'case "([^"]+)":', line)
              if m:
                  pending.append(m.group(1))
              m = re.search(r"return Theme\.(fill\w+)", line)
              if m:
                  for word in pending:
                      card_group[word] = m.group(1)
                  if line.startswith("default:"):
                      card_group["*"] = m.group(1)
                  pending = []

          # --- the model's grouping, read out of health() ----------------------------
          body = re.search(r"Machine::Health Machine::health\(\) const\n\{(.*?)\n\}", model, re.S)
          if not body:
              sys.exit("could not find Machine::health() in app/omnuv/machinemodel.cpp")

          model_group, pending = {}, []
          for line in body.group(1).splitlines():
              pending += re.findall(r'status == QStringLiteral\("([^"]+)"\)', line)
              m = re.search(r"return Health::(\w+);", line)
              if m:
                  for word in (pending or ["*"]):
                      model_group[word] = m.group(1)
                  pending = []

          # The one correspondence, written once.
          same = {"Good": "fillSuccess", "Moving": "fillCaution",
                  "Resting": "fillNeutral", "Bad": "fillCritical"}

          translated = {w: same.get(h, "?") for w, h in model_group.items()}
          if translated != card_group:
              print("The tray and the card no longer group Core's status words the same way.")
              print("  card  (MachineCard.qml statusColour): %r" % (card_group,))
              print("  model (machinemodel.cpp health):      %r" % (translated,))
              print()
              print("One machine would wear two different dots in two of our own surfaces.")
              sys.exit(1)

          # Prove the check can still see: the grouping has to be the real one, with
          # every word Core's state::friendly can produce and a default for the seventh.
          for word in ("Running", "Starting", "Restarting", "Stopping", "Stopped", "Deleting", "*"):
              if word not in card_group:
                  sys.exit("statusColour() no longer names %r; the parse is reading the wrong thing" % word)

          # --- and the tray renders each group with Theme's own colour ---------------
          for health, fill in same.items():
              m = re.search(r'property color %s:(?:(?!\n\s*readonly property)[\s\S])*?"(#[0-9A-Fa-f]+)" : "(#[0-9A-Fa-f]+)"' % fill, theme)
              if not m:
                  sys.exit("Theme.qml no longer defines %s as a dark/light pair" % fill)
              dark, light = m.groups()
              want = 'QColor %s(bool dark)  { return dark ? QColor("%s") : QColor("%s"); }' % (fill, dark, light)
              if re.sub(r"\s+", " ", want) not in re.sub(r"\s+", " ", tray):
                  print("app/omnuv/tray.cpp does not carry Theme.qml's %s:" % fill)
                  print("  " + want)
                  sys.exit(1)
              if "case Machine::Health::%s:" % health not in tray:
                  sys.exit("tray.cpp no longer renders Health::%s" % health)

          print("the tray, the card and Theme agree on %d status words and 4 colours"
                % (len(card_group) - 1))
          PY

      # **The one thing in this fork that is actually run rather than grepped.**
      #
      # Every other check here reads source and decides whether it looks right.
      # `app/omnuv/streamquality.cpp` decides what a person is told about their
      # stream and what `scripts/gaming-rig-e2e` read back (removed from the omnuv repo on 21 September 2026), and neither of
      # those is something a grep can judge -- so it is compiled against ~120
      # lines of stubs and driven with real VIDEO_STATS values.
      #
      # It needs no Qt, no SDL and no qmake: g++ and the repository. The file
      # under test is compiled unmodified, with moonlight's own decoder.h, so
      # the struct the assertions are built on is the real one.
      #
      # It found two defects on its first run, which is the argument for it:
      # the verdict read `good` during the settle window in which nothing had
      # been graded, and a mark left up by one stream survived into the next.
      - name: The stream quality ladder, run
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wformat -Wno-unused-function \
              -I app/omnuv/test/stub -I app \
              -o /tmp/streamquality_test app/omnuv/test/streamquality_test.cpp
          /tmp/streamquality_test

          # Prove the check can still fail. A driver whose assertions have been
          # commented out passes exactly like a correct one, so one assertion
          # is inverted in a copy and the run has to reject it.
          sed 's|assert(strstr(g_lastLog, "host=na")|assert(!strstr(g_lastLog, "host=na")|' \
              app/omnuv/test/streamquality_test.cpp > /tmp/mutant.cpp
          g++ -std=c++17 -Wno-unused-function -I app/omnuv/test/stub -I app \
              -o /tmp/mutant /tmp/mutant.cpp
          if /tmp/mutant 2>/dev/null; then
            echo "The driver passes with an inverted assertion; it is not checking anything."
            exit 1
          fi
          echo "the ladder runs, and the driver fails when it should"

      # The estate window's words — the history sentences, the pulse and the
      # spend series — are a QML JavaScript library, so node runs them as
      # they ship. The mutant shows an unread machine list as zeros, which is
      # the one thing the pulse must never do.
      - name: The estate's words, run
        run: |
          set -euo pipefail
          node app/omnuv/test/estate_test.js
          sed 's|    if (machinesLoaded) {|    if (true) {|' app/omnuv/estate.js > /tmp/estate.js
          if ESTATE_JS=/tmp/estate.js node app/omnuv/test/estate_test.js >/dev/null; then
            echo "The estate test passes against a broken pulse; it is not checking anything."
            exit 1
          fi
          echo "the estate's words hold, and the test fails when they do not"
