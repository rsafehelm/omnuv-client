# The rule that keeps this fork alive, checked rather than remembered.
#
# A fork that edits a hundred upstream files cannot follow upstream, and a fork
# that cannot follow upstream dies. So our changes go in new files, and only a
# short list of upstream files may be touched at all. This fails the build when
# anything else differs, which is the point: the person who breaks the rule in a
# year will not be the person who wrote it.
#
# Raising the budget is allowed. Doing it silently is not: the list lives here,
# in a diff someone reviews.
name: change budget

on:
  push:
  pull_request:

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # moonlight-common-c is where the connection stages are defined, and
          # the last step below reads them. Three small submodules; the one
          # that matters is 1.7 MB.
          submodules: recursive

      - name: Compare against the upstream base
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/moonlight-stream/moonlight-qt
          git fetch -q --no-tags upstream master

          # Everything we add lives under these paths.
          ADDED='^(app/omnuv/|app/gui/OmnuvView.qml|CHANGES.omnuv.md|README.omnuv.md|.github/workflows/omnuv-)'
          # And these upstream files, and only these, may be edited.
          #
          # .github/dependabot.yml is the first entry added after the fork, and
          # the reason is worth keeping: it is upstream's, it updates submodules
          # daily, and this fork pins its submodules to the upstream commit it
          # is based on. Left alone it opens a pull request every day proposing
          # to break that pin. Removed here rather than fought.
          # app/main.cpp is the second entry, added for residency. It bought
          # two lines then: QSystemTrayIcon needs a QApplication rather than
          # the QGuiApplication upstream constructs, and a program that
          # survives its window being closed needs
          # setQuitOnLastWindowClosed(false). Both are single lines next to
          # each other; neither has an equivalent that could live in a new
          # file, because the application object is constructed here.
          # It bought two more on 15 Sep for the `signin` action — an include
          # and one arm of the switch that already dispatches every other
          # action — for the same reason: that switch is here, and everything
          # the arm calls is in app/omnuv/signin.cpp.
          # It bought three more on 15 Sep for the `stream` verb: one changed
          # string literal and two context properties, in the arm that already
          # constructs that action's launcher. The rig measured what
          # `Moonlight.exe stream <host> "<app>"` actually drew and answered
          # `SEGUE=absent` — upstream's Material ErrorMessageDialog, upstream's
          # words — and that command is what `omnuv-connect --stream` and every
          # `omnuv://stream` link run, so it was the buyer-facing surface for
          # everyone outside the widget. It could not live in a new file: the
          # switch that chooses an initial view is here, and so is the parse
          # that produces the two positional arguments the view needs. The view
          # itself is app/omnuv/OmnuvCliSegue.qml.
          # And three more on 15 Sep for the style: an include, and
          # QQuickStyle::setStyle("Material") replaced by a call into
          # app/omnuv/appearance.cpp that picks FluentWinUI3 on Windows and
          # Material everywhere else. The same reason again, and this time it
          # is Qt's rule rather than ours: setStyle() refuses once QtQuick
          # .Controls has been registered, so it has to run before the engine
          # loads any QML, and nothing of ours runs earlier than this function.
          # .github/workflows/build.yml is the third entry, and it buys one
          # line: `if: false` on the Windows/macOS job. Those platforms are
          # built on the lab rigs now, which have the same pinned toolchains
          # and can additionally *run* the result — CI only ever proved the
          # thing compiled, and the bug that made every Windows build exit at
          # startup was invisible to it.
          # app/cli/commandlineparser.(cpp|h) is the fourth entry, and it buys
          # four lines: one enum value, one arm in the action loop, and one line
          # of help text, for the `signin` action. It could not live in a new
          # file. Upstream's parser terminates the process on any option it does
          # not recognise, so a global `--print-code` flag of ours is a usage
          # error before our own code runs; only a positional action is
          # tolerated, and the loop that recognises those is in this file.
          # Everything the action then does is in app/omnuv/signin.cpp, which is
          # why this is four lines and not a sub-parser.
          # scripts/build-arch.bat is the fifth entry, and it buys sixteen lines,
          # twelve of them comment. Upstream ships Material, so it excludes every
          # other style from windeployqt *and* deletes their QML modules
          # afterwards -- two separate places, both of which had to stop naming
          # FluentWinUI3 and Fusion. It could not live in a new file: this is the
          # only invocation of windeployqt, and the deletions are in the same
          # script a few lines below it.
          #
          # Fusion is kept as well as Fluent, and that is not scope creep:
          # FluentWinUI3 implements a subset of Qt Quick Controls, and the
          # unsupported ones fall back to Fusion -- StackView among them, which
          # main.qml is built on.
          EDITED='^(app/gui/main.qml|app/main.cpp|app/app.pro|app/cli/commandlineparser.(cpp|h)|app/Info.plist|app/version.txt|app/deploy/.*|app/res/.*|scripts/build-arch.bat|.github/workflows/build.yml|.github/dependabot.yml)$'

          base=$(git merge-base HEAD upstream/master)
          echo "base: $base"
          over=$(git diff --name-only "$base"..HEAD | grep -vE "$ADDED" | grep -vE "$EDITED" || true)

          if [ -n "$over" ]; then
            echo
            echo "These upstream files were changed, and are not in the budget:"
            echo "$over" | sed 's/^/  /'
            echo
            echo "Either put the change in a new file under app/omnuv/, or send it"
            echo "upstream, or widen the list in this workflow with a reason."
            exit 1
          fi
          echo "within budget: $(git diff --name-only "$base"..HEAD | wc -l) file(s) changed"

      # stdout is a machine-readable channel, and a channel with two writers is
      # not one. `signin` writes key=value lines that a harness parses; every
      # other line this application produces — logs, progress, complaints — goes
      # to the log file or to stderr. That holds today by construction, and this
      # is what keeps it holding after somebody adds a print to debug something.
      #
      # Scoped to our own directory: upstream's cli/ prints to stdout
      # legitimately (`list` is a report), and the point here is only that
      # Omnuv's code has exactly one place that does.
      - name: Only signin.cpp writes to stdout
        run: |
          set -euo pipefail
          other=$(grep -rlE '\b(fprintf|fputs|fwrite)[[:space:]]*\([^;]*stdout|\bstd::cout\b|\bputs[[:space:]]*\(' \
                    app/omnuv --include='*.cpp' --include='*.h' \
                  | grep -v '^app/omnuv/signin\.cpp$' || true)

          if [ -n "$other" ]; then
            echo "These files in app/omnuv/ write to stdout, which belongs to signin:"
            echo "$other" | sed 's/^/  /'
            exit 1
          fi

          # And prove the check can still see. A grep whose pattern has rotted
          # returns nothing, and nothing is exactly what a clean tree returns —
          # so it has to find the one writer that is supposed to be there.
          grep -qE '\bfprintf\(stdout' app/omnuv/signin.cpp
          echo "stdout has one writer: app/omnuv/signin.cpp"

      # Two rules `app/omnuv/Theme.qml` exists to hold, checked rather than
      # remembered, because both fail silently.
      #
      # An icon is named or it is not reviewable. A Segoe Fluent Icons glyph is
      # a private-use character: pasted into a view it is invisible in a diff,
      # it is not greppable, and one is indistinguishable from the next — so
      # `Theme.icon.refresh` is not a convenience, it is the only form of it a
      # person can check. Theme itself writes them as `\uE72C`-style escapes for the
      # same reason: the escape is text somebody can search for and look up.
      #
      # And a duration that forgot to collapse takes an accessibility setting
      # away from the person who set it. Microsoft's own description of reduced
      # motion says moving content "can cause seizures in users with
      # photo-sensitive epilepsy", so a number here that is not gated on
      # `motion` is a defect rather than a polish item.
      - name: Icons are named, and durations collapse
        run: |
          set -euo pipefail

          # Literal private-use characters, anywhere in our code but Theme.qml —
          # which has none either, and is excluded only so this stays true if
          # one is ever deliberately added there.
          glyphs=$(grep -rlP '[\x{E000}-\x{F8FF}]' app/omnuv \
                     --include='*.qml' --include='*.cpp' --include='*.h' \
                   | grep -v '^app/omnuv/Theme\.qml$' || true)
          # And the escaped form, which is just as unreadable in a view.
          glyphs="$glyphs$(grep -rlE '\\u[eE][0-9a-fA-F]{3}' app/omnuv \
                             --include='*.qml' --include='*.cpp' --include='*.h' \
                           | grep -v '^app/omnuv/Theme\.qml$' || true)"

          if [ -n "${glyphs//[[:space:]]/}" ]; then
            echo "These files carry an icon code point instead of a Theme.icon name:"
            echo "$glyphs" | sed 's/^/  /'
            exit 1
          fi

          # Prove the check can still see. A pattern that has rotted finds
          # nothing, and nothing is what a clean tree looks like — so it has to
          # find the one file that is supposed to have them.
          test "$(grep -cE '\\u[eE][0-9a-fA-F]{3}' app/omnuv/Theme.qml)" -ge 13

          # Every duration Theme exposes is gated on the reduced-motion setting.
          ungated=$(grep -nE 'property int duration' app/omnuv/Theme.qml \
                    | grep -v 'motion ?' || true)
          if [ -n "$ungated" ]; then
            echo "These durations do not collapse under reduced motion:"
            echo "$ungated" | sed 's/^/  /'
            exit 1
          fi
          test "$(grep -cE 'property int duration' app/omnuv/Theme.qml)" -ge 4

          echo "icons are named; $(grep -cE 'property int duration' app/omnuv/Theme.qml) durations collapse"

      # **Every connection stage has a sentence a buyer can read, and the list
      # comes from upstream rather than from this file.**
      #
      # `app/omnuv/OmnuvSegue.qml` switches on moonlight-common-c's stage names
      # to decide what a person is told while a stream starts and what they are
      # told when it does not. Those names are `stageNames[]` in
      # `moonlight-common-c/src/Connection.c`; `Limelight.h` calls them stable,
      # which is what makes switching on them legitimate, and stable is not the
      # same as closed. A release that adds a thirteenth would fall through to a
      # sentence naming no cause — correct, and worse than the one somebody
      # would have written had they known.
      #
      # So the check is against upstream's own array, in the submodule, and it
      # fails on the commit that bumps it rather than on the first failure a
      # buyer sees.
      - name: Every connection stage has a sentence
        run: |
          set -euo pipefail
          src=moonlight-common-c/moonlight-common-c/src/Connection.c
          names=$(sed -n '/^static const char\* stageNames\[/,/^};/p' "$src" \
                  | grep -oE '"[^"]+"' | tr -d '"')

          # Prove the extraction can still see. A `sed` range that has rotted
          # returns nothing, and nothing is exactly what "no stage is missing"
          # looks like — the calm an empty answer produces. There are twelve
          # today and `STAGE_MAX` is 12; fewer than ten means the pattern broke,
          # not that upstream deleted the stream.
          test "$(echo "$names" | wc -l)" -ge 10

          missing=""
          while IFS= read -r n; do
            grep -qF "case \"$n\":" app/omnuv/OmnuvSegue.qml || missing="$missing  $n"$'\n'
          done <<< "$names"

          if [ -n "${missing//[[:space:]]/}" ]; then
            echo "These connection stages have no sentence in app/omnuv/OmnuvSegue.qml:"
            printf '%s' "$missing"
            echo
            echo "Read what the stage actually does in Connection.c and write a sentence"
            echo "for it. A plain one is fine; an invented cause is not."
            exit 1
          fi
          echo "all $(echo "$names" | wc -l) connection stages have a sentence"

      # And the numbers stay folded away. Upstream reports a failed stage as
      # `Starting %1 failed: Error %2` in a `main.qml` dialog whose id is
      # `streamSegueErrorDialog`; our segue never opens it, which is the whole
      # reason our segue exists. A reference to it from our code would put the
      # code back in front of a buyer without changing a line that looks like
      # it does.
      - name: A buyer is never shown an error code
        run: |
          set -euo pipefail
          # A *use* — the name followed by a property access or an assignment —
          # and not on a comment line. Both filters are needed and the first
          # run of this check proved it: the segue explains in its own comment
          # why it never opens that dialog, and a bare grep matched the
          # explanation and failed against code that was correct. A check whose
          # first finding is its own prose is the one shape CLAUDE.md names for
          # source-level checks, and it is not a reason to reword the comment.
          if grep -rnE 'streamSegueErrorDialog[[:space:]]*[.=]' app/omnuv \
             | grep -vE ':[[:space:]]*(//|\*)'; then
            echo
            echo "app/omnuv/ opens upstream's stream error dialog, which prints a numeric"
            echo "code. Put the failure in OmnuvSegue's panel instead: a sentence, the"
            echo "actions that apply, and the code under Details."
            exit 1
          fi
          # Prove the check can still see, both halves of it: the dialog it is
          # looking for exists, and the pattern still matches a real use of it
          # where one is supposed to be.
          grep -q 'id: streamSegueErrorDialog' app/gui/main.qml
          grep -qE 'streamSegueErrorDialog[[:space:]]*[.=]' app/gui/StreamSegue.qml
          echo "no path from app/omnuv/ to upstream's error dialog"

      # **And the command line reaches the segue a buyer sees.**
      #
      # The step above proves our code never opens upstream's numeric-code
      # dialog. It says nothing about whether our code is *reached*, and on
      # 15 Sep 2026 the Windows rig measured that it was not: `Moonlight.exe
      # stream <host> "<app>"` went to upstream's `CliStartStreamSegue` and its
      # Material `ErrorMessageDialog`, and the rig reported `SEGUE=absent`.
      #
      # That is the command `omnuv-connect --stream` runs, the command every
      # `omnuv://stream` link from the console runs, and the command the
      # gaming-rig end-to-end streams with — so the one automated proof of the
      # streaming experience was exercising upstream's surface, and a parity
      # matrix fed by it would have read *same* on a row where the two paths
      # genuinely differed. A check that only forbids is half a check; this is
      # the half that requires.
      - name: The command line opens our segue
        run: |
          set -euo pipefail
          if grep -q 'initialView = "qrc:/gui/CliStartStreamSegue.qml"' app/main.cpp; then
            echo "The stream action opens upstream's segue, which answers a failure with a"
            echo "Material dialog and a numeric code. Point it at qrc:/omnuv/OmnuvCliSegue.qml."
            exit 1
          fi
          grep -q 'initialView = "qrc:/omnuv/OmnuvCliSegue.qml"' app/main.cpp
          # Prove the check can still see: the view it names exists, is shipped
          # in our own resource file, and is the segue rather than a second one.
          test -f app/omnuv/OmnuvCliSegue.qml
          grep -q '<file>OmnuvCliSegue.qml</file>' app/omnuv/omnuv.qrc
          grep -qE '^OmnuvSegue \{' app/omnuv/OmnuvCliSegue.qml
          echo "the stream action opens app/omnuv/OmnuvCliSegue.qml"

      # **The segue says what it drew, because nothing else can look at it.**
      #
      # `deployment/ansible/files/omnuv-run.ps1` in the platform repository
      # drives a stream against a name under `.invalid` and reads the sentence
      # out of the client's log, anchored on `Qt Info: Omnuv segue: failed
      # headline=`. That contract was written down there on the client's behalf
      # and the client never held up its end: until 15 Sep 2026 the string had
      # never appeared in this repository, so the rig would have answered
      # `SEGUE=absent` even after the routing above was fixed.
      #
      # `console.info`, not `console.error`: Qt's `writeToConsole` maps `Info`
      # to `logger.info()` and `Error` to `logger.critical()`
      # (qtdeclarative/src/qml/qml/qqmlbuiltinfunctions.cpp), and Moonlight's
      # handler renders those as `Qt Info:` and `Qt Critical:`
      # (app/main.cpp:216-220). The wrong one is a line the harness cannot see.
      #
      # Anchored at the start of the line so this cannot match the segue's own
      # comment explaining the contract — a source check that finds its own
      # prose is the one shape CLAUDE.md names, and this file has met it once
      # already, three steps up.
      - name: The segue reports the sentence it rendered
        run: |
          set -euo pipefail
          HEAD='^[[:space:]]*console\.info\("Omnuv segue: failed headline='
          BODY='^[[:space:]]*console\.info\("Omnuv segue: details='
          for pat in "$HEAD" "$BODY"; do
            if ! grep -qE "$pat" app/omnuv/OmnuvSegue.qml; then
              echo "app/omnuv/OmnuvSegue.qml does not report what it drew:"
              echo "  $pat"
              echo
              echo "deployment/ansible/files/omnuv-run.ps1 reads these two lines and has no"
              echo "other way to know whether the failure panel rendered a sentence, an"
              echo "error code, or nothing at all."
              exit 1
            fi
          done
          # Prove both patterns can still see, against a line written here
          # rather than one in the tree: a rotted pattern and a missing call
          # return the same nothing.
          probe=$(mktemp --suffix=.qml)
          printf '    console.info("Omnuv segue: failed headline=" + oneLine(t))\n' > "$probe"
          printf '    console.info("Omnuv segue: details=" + oneLine(t))\n' >> "$probe"
          grep -qE "$HEAD" "$probe"
          grep -qE "$BODY" "$probe"
          rm -f "$probe"
          echo "the segue reports its headline and its details at Info level"

      # **The streaming login never reaches a log, and never reaches a disk.**
      #
      # A machine mints that login once and Core hands it over once — the
      # password is cleared in the same statement that returns it — so there is
      # no second copy to compare against and no way to notice a leak after the
      # fact. It exists for the few hundred milliseconds between one Core reply
      # and one request to the machine, and the only places it could escape are
      # a log line and a settings write. Both are one keystroke away from a
      # developer debugging something at two in the morning, which is what this
      # step is for.
      #
      # The log file is the reason it matters more here than for the sign-in
      # token: `app/main.cpp` installs a message handler that writes every
      # qDebug/qInfo/qWarning to a file people paste into support threads.
      - name: The stream credential never reaches a log or a setting
        run: |
          set -euo pipefail

          # A logging call, or a persistence call, on the same line as the
          # words this credential travels under.
          LEAK='(qDebug|qInfo|qWarning|qCritical|qFatal|setValue|OmnuvCredentials::store)[^;]*(password|stream-credentials|Basic )'

          if grep -rnE "$LEAK" app/omnuv --include='*.cpp' --include='*.h'; then
            echo
            echo "A streaming login can reach a log file or a setting from here. It is"
            echo "issued once and cannot be reissued, so a copy of it outlives the thing"
            echo "it was for. Keep it in the call that spends it."
            exit 1
          fi

          # Prove the check can still see. A clean tree and a rotted pattern
          # return the same nothing, so the pattern has to be shown matching
          # the thing it is for — against a line written here rather than one
          # in the tree, because the tree is supposed never to contain one.
          probe=$(mktemp --suffix=.cpp)
          printf 'qInfo() << "login" << password;\n' > "$probe"
          grep -qE "$LEAK" "$probe"
          rm -f "$probe"
          echo "no path from a stream credential to a log or a setting"

      # **The launch ladder says the same four things the web console says, in
      # the same words, from the same fields.**
      #
      # A buyer watching a machine start sees it in two places: the browser and
      # this application. Two vocabularies for one launch is the thing v0.2
      # refuses outright — "Private network · not observed" has to mean exactly
      # one thing, and a person who learns it in one place has to have learned
      # it in the other.
      #
      # The console lives in a private repository this workflow cannot reach, so
      # this cannot be a comparison; it is a pin. The four steps, the fields
      # each one is drawn from, and the state each combination produces are
      # written out below exactly as `console-buyer`'s `ladder()` has them, and
      # a change to any of them fails here. That is the point: the next person
      # to alter this ladder has to alter this list in the same diff, where a
      # reviewer can see that the console moved too.
      #
      # Whitespace is squeezed before comparing, so reformatting is free and
      # only the vocabulary is pinned.
      - name: The launch ladder matches the console's
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib

          src = pathlib.Path("app/omnuv/MachineCard.qml").read_text()
          body = re.search(r"function ladder\(\) \{(.*?)\n    \}", src, re.S)
          if not body:
              sys.exit("could not find ladder() in app/omnuv/MachineCard.qml")

          def squeeze(text):
              return re.sub(r"\s+", " ", text).strip()

          # The evidence, and then the four steps. Left column is where it is
          # written; right column is what console-buyer/.../instances says.
          pinned = [
              # what confirms a step, never a constant
              'readonly property bool running: model.status === "Running"',
              'readonly property bool booted: running || model.status === "Starting"',
              'readonly property bool addressed: model.privateIp !== ""',
              'readonly property bool failed: model.status === "Needs attention"',
              # the four steps, in order, with their states
              '{ label: qsTr("Requested and placed"), state: "done", note: "" },',
              'label: qsTr("Booting"),',
              'state: failed ? "failed" : running ? "done" : booted ? "active" : "unknown",',
              'note: (!running && booted) ? model.waitingOn : ""',
              'label: qsTr("Private network"),',
              'state: addressed ? "done" : running ? "unknown" : "pending",',
              'label: qsTr("Running"),',
              'state: running ? "done" : failed ? "failed" : "pending",',
          ]

          flat = squeeze(src)
          missing = [p for p in pinned if squeeze(p) not in flat]
          if missing:
              print("The launch ladder no longer matches the console's:")
              for m in missing:
                  print("  " + m)
              print()
              print("If this was deliberate, change console-buyer's ladder() in the same")
              print("change and update the list in this workflow. If it was not, a buyer")
              print("is about to be told two different things about one machine.")
              sys.exit(1)

          # Prove the check can still see. A pattern that has rotted matches
          # nothing, and nothing is exactly what a clean tree looks like.
          for word in ("done", "active", "pending", "unknown", "failed"):
              if '"%s"' % word not in body.group(1):
                  sys.exit("ladder() never produces the state %r; the check is reading the wrong thing" % word)

          print("the ladder pins %d expressions and produces all five states" % len(pinned))
          PY
